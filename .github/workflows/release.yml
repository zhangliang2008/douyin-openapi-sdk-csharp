name: Release to NuGet

# 打一个 v 开头的 tag 即自动发布，例如：
#     git tag v1.0.4 && git push origin v1.0.4
#
# 发布凭证使用 nuget.org 的 Trusted Publishing（OIDC）：
#   仓库里不存任何长期密钥，工作流用 GitHub 签发的短期 OIDC token
#   向 nuget.org 换取一个 1 小时有效的临时 API Key 来完成推送。
#
# ── 首次使用前的准备（一次性）─────────────────────────────────────
# 1) nuget.org → 右上头像 → Trusted Publishing → Add new policy
#       Repository Owner : zhangliang2008
#       Repository       : douyin-openapi-sdk-csharp
#       Workflow File    : release.yml        （只填文件名，不带 .github/workflows/ 前缀）
#       Environment      : 留空（本工作流未使用 GitHub Environments）
#    在同一页面配置 Scopes：允许 Push new packages 与 Push new package versions，
#    Glob Pattern 填 DouyinOpenApi。
# 2) 本仓库 Settings → Secrets and variables → Actions → New repository secret
#       NUGET_USER = 你在 nuget.org 的「用户名(profile name)」，不是邮箱
#
# ── 与 API Key 方式的区别（会影响排错）─────────────────────────────
#   * 临时 Key 有效期仅 1 小时 → 换取必须紧挨在推送之前，不能提前换；
#   * 一个 OIDC token 只能换一次 Key → 换取失败要重跑整个工作流；
#   * 私有仓库首次建策略时是「7 天临时生效」，成功发布一次后才转永久
#     （nuget.org 借此拿到仓库 ID，防止删库重建冒充）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 1.0.4）。留空则取 tag 名去掉前缀 v'
        required: false
        type: string

permissions:
  contents: write     # 创建 GitHub Release
  id-token: write     # 关键：允许工作流申请 GitHub OIDC token

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 打包并发布到 NuGet.org
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 取完整历史，便于 Release Notes 生成

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------------------------------------------------------------------
      # 版本号：优先用手动输入，否则取 tag 名去掉 v
      # ---------------------------------------------------------------------
      - name: 计算版本号
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号 '$VERSION' 不合法，应形如 1.0.4 或 1.1.0-beta.1"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "将发布版本：$VERSION"

      - name: 检查 NUGET_USER 是否已配置
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::未配置 NUGET_USER。请在 Settings → Secrets and variables → Actions 中添加你在 nuget.org 的用户名（profile name）。"
            exit 1
          fi

      - name: 还原依赖
        run: dotnet restore

      # 发布前必须过测试：宁可不发，也不要把坏包推上 NuGet（版本号一旦占用无法撤回）
      - name: 编译
        run: dotnet build -c Release --no-restore -p:Version=${{ env.VERSION }}

      - name: 跑测试
        run: dotnet test -c Release --no-build -p:Version=${{ env.VERSION }}

      - name: 打包
        run: dotnet pack src/DouyinOpenApi -c Release --no-build -p:Version=${{ env.VERSION }} -o artifacts

      - name: 列出产物（便于在日志里核对版本）
        shell: bash
        run: ls -la artifacts/

      # 换取凭证必须紧贴推送：临时 Key 只有 1 小时有效期
      - name: 获取 nuget.org 临时凭证（OIDC → 临时 API Key）
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 推送到 NuGet.org
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: 创建 GitHub Release 并附上 nupkg
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          body: |
            NuGet: https://www.nuget.org/packages/DouyinOpenApi/${{ env.VERSION }}

            ```xml
            <PackageReference Include="DouyinOpenApi" Version="${{ env.VERSION }}" />
            ```
